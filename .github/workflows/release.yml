name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, publish]
        required: true
      commit:
        description: Exact candidate commit (40 lowercase hex)
        required: true
      version_name:
        description: Candidate version name (release tag is v plus this value)
        required: true
      version_code:
        description: Candidate version code, greater than the previous release
        required: true
      prepare_run_id:
        description: Successful preparation run ID (publish only)
      prepare_attempt:
        description: Preparation run attempt (publish only)
      artifact_id:
        description: Exact preparation artifact ID (publish only)
      approval_json:
        description: Complete approval JSON from the release evidence template (publish only)

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CANDIDATE_COMMIT: ${{ inputs.commit }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  PINT_SIGNER_SHA256: ${{ vars.PINT_SIGNER_SHA256 }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    if: inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREPARE_RUN_ID: ${{ github.run_id }}
      PREPARE_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate candidate inputs
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_COMMIT" = "$GITHUB_SHA"
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$VERSION_CODE" -le 2100000000
          [[ "$PINT_SIGNER_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Validate release signing configuration
        env:
          PINT_KEY_ALIAS: ${{ secrets.PINT_KEY_ALIAS }}
          PINT_KEY_PASSWORD: ${{ secrets.PINT_KEY_PASSWORD }}
          PINT_KEYSTORE_PASSWORD: ${{ secrets.PINT_KEYSTORE_PASSWORD }}
          PINT_KEYSTORE_BASE64: ${{ secrets.PINT_KEYSTORE_BASE64 }}
        run: |
          for name in PINT_KEY_ALIAS PINT_KEY_PASSWORD PINT_KEYSTORE_PASSWORD PINT_KEYSTORE_BASE64; do
            test -n "${!name}" || { echo "Missing required repository secret: $name"; exit 1; }
          done
      - name: Verify generated drawables
        run: |
          node tools/generate-drawables.mjs
          node tools/validate-drawables.mjs
          test -z "$(git status --porcelain=v1)"
      - name: Verify release checkers
        run: python3 -m unittest discover -s tools -p 'test_verify_release_*.py'
      - name: Build signed candidate
        env:
          PINT_KEY_ALIAS: ${{ secrets.PINT_KEY_ALIAS }}
          PINT_KEY_PASSWORD: ${{ secrets.PINT_KEY_PASSWORD }}
          PINT_KEYSTORE_PASSWORD: ${{ secrets.PINT_KEYSTORE_PASSWORD }}
          PINT_KEYSTORE_BASE64: ${{ secrets.PINT_KEYSTORE_BASE64 }}
        run: >-
          ./gradlew
          -PpintVersionCode="$VERSION_CODE"
          -PpintVersionName="$VERSION_NAME"
          :lib:testDebugUnitTest
          :pint:testReleaseUnitTest
          :pint:lintDebug
          :pint:assembleDebug
          :pint:assembleRelease
          :pint:jacocoBehaviorTestCoverageVerification
          :calorie-source:testDebugUnitTest
          :calorie-source:lintDebug
          :calorie-source:assembleDebug
          --no-daemon
      - name: Record signed candidate identity
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          cp pint/build/outputs/apk/release/pint-release.apk "$RUNNER_TEMP/candidate/"
          APK="$RUNNER_TEMP/candidate/pint-release.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signer.txt"
          python3 tools/verify-release-signer.py "$RUNNER_TEMP/signer.txt" "$PINT_SIGNER_SHA256"
          export APK_PACKAGE="$(apkanalyzer manifest application-id "$APK")"
          export APK_VERSION_NAME="$(apkanalyzer manifest version-name "$APK")"
          export APK_VERSION_CODE="$(apkanalyzer manifest version-code "$APK")"
          export APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          python3 tools/verify-release-candidate.py record "$RUNNER_TEMP/candidate"
          (cd "$RUNNER_TEMP/candidate" && sha256sum pint-release.apk > pint-release.apk.sha256)
      - name: Store candidate for device verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pint-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
      PREPARE_ATTEMPT: ${{ inputs.prepare_attempt }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      APPROVAL_JSON: ${{ inputs.approval_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "build-tools;34.0.0"
      - name: Download exact preparation artifact
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]]
          for value in "$PREPARE_RUN_ID" "$PREPARE_ATTEMPT" "$ARTIFACT_ID"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID/attempts/$PREPARE_ATTEMPT" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID/attempts/$PREPARE_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact.zip"
          python3 tools/verify-release-candidate.py unpack "$RUNNER_TEMP"
      - name: Verify candidate and approval
        run: |
          APK="$RUNNER_TEMP/candidate/pint-release.apk"
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check pint-release.apk.sha256)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signer.txt"
          python3 tools/verify-release-signer.py "$RUNNER_TEMP/signer.txt" "$PINT_SIGNER_SHA256"
          export APK_PACKAGE="$(apkanalyzer manifest application-id "$APK")"
          export APK_VERSION_NAME="$(apkanalyzer manifest version-name "$APK")"
          export APK_VERSION_CODE="$(apkanalyzer manifest version-code "$APK")"
          export APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/v$VERSION_NAME" --jq .sha)" = "$CANDIDATE_COMMIT"
          python3 tools/verify-release-candidate.py verify "$RUNNER_TEMP"
      - name: Publish approved bytes
        run: >-
          gh release create "v$VERSION_NAME"
          "$RUNNER_TEMP/candidate/pint-release.apk"
          "$RUNNER_TEMP/candidate/pint-release.apk.sha256"
          "$RUNNER_TEMP/candidate/candidate.json"
          "$RUNNER_TEMP/approval.json"
          "$RUNNER_TEMP/evidence.md"
          --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/evidence.md" --latest

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.2.0 or v1.2.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  PINT_SIGNER_SHA256: ${{ vars.PINT_SIGNER_SHA256 }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and signer
        run: python3 tools/verify-release-inputs.py
      - name: Check release does not exist
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/tags"
          if grep -Fxq "v$VERSION_NAME" "$RUNNER_TEMP/tags"; then
            echo "Release v$VERSION_NAME already exists. Test and publish its draft, or choose a new version."
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' > "$RUNNER_TEMP/git-tags"
          if grep -Fxq "v$VERSION_NAME" "$RUNNER_TEMP/git-tags"; then
            echo "Tag v$VERSION_NAME already exists. Choose a new version."
            exit 1
          fi
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Validate release signing configuration
        env:
          PINT_KEY_ALIAS: ${{ secrets.PINT_KEY_ALIAS }}
          PINT_KEY_PASSWORD: ${{ secrets.PINT_KEY_PASSWORD }}
          PINT_KEYSTORE_PASSWORD: ${{ secrets.PINT_KEYSTORE_PASSWORD }}
          PINT_KEYSTORE_BASE64: ${{ secrets.PINT_KEYSTORE_BASE64 }}
        run: |
          for name in PINT_KEY_ALIAS PINT_KEY_PASSWORD PINT_KEYSTORE_PASSWORD PINT_KEYSTORE_BASE64; do
            test -n "${!name}" || { echo "Missing required repository secret: $name"; exit 1; }
          done
      - name: Verify generated drawables
        run: |
          node tools/generate-drawables.mjs
          node tools/validate-drawables.mjs
          test -z "$(git status --porcelain=v1)"
      - name: Verify release checkers
        run: python3 -m unittest discover -s tools -p 'test_verify_release_*.py'
      - name: Build signed candidate
        env:
          PINT_KEY_ALIAS: ${{ secrets.PINT_KEY_ALIAS }}
          PINT_KEY_PASSWORD: ${{ secrets.PINT_KEY_PASSWORD }}
          PINT_KEYSTORE_PASSWORD: ${{ secrets.PINT_KEYSTORE_PASSWORD }}
          PINT_KEYSTORE_BASE64: ${{ secrets.PINT_KEYSTORE_BASE64 }}
        run: >-
          ./gradlew
          -PpintVersionCode="$VERSION_CODE"
          -PpintVersionName="$VERSION_NAME"
          :lib:testDebugUnitTest
          :pint:testReleaseUnitTest
          :pint:lintDebug
          :pint:assembleDebug
          :pint:assembleRelease
          :pint:jacocoBehaviorTestCoverageVerification
          :calorie-source:testDebugUnitTest
          :calorie-source:lintDebug
          :calorie-source:assembleDebug
          --no-daemon
      - name: Verify signed APK and upgrade version
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          cp pint/build/outputs/apk/release/pint-release.apk "$RUNNER_TEMP/candidate/"
          APK="$RUNNER_TEMP/candidate/pint-release.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signer.txt"
          python3 tools/verify-release-signer.py "$RUNNER_TEMP/signer.txt" "$PINT_SIGNER_SHA256"
          test "$(apkanalyzer manifest application-id "$APK")" = io.ericchernuka.pintprogress
          test "$(apkanalyzer manifest version-name "$APK")" = "$VERSION_NAME"
          test "$(apkanalyzer manifest version-code "$APK")" = "$VERSION_CODE"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          if test -s "$RUNNER_TEMP/published-tags"; then
            mkdir "$RUNNER_TEMP/previous"
            gh release download "$(head -n 1 "$RUNNER_TEMP/published-tags")" --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
            for previous in "$RUNNER_TEMP/previous/"*.apk; do
              previous_code="$(apkanalyzer manifest version-code "$previous")"
              if test "$VERSION_CODE" -le "$previous_code"; then
                echo "Choose a higher version: generated code $VERSION_CODE must exceed previous APK code $previous_code."
                exit 1
              fi
            done
          fi
          (cd "$RUNNER_TEMP/candidate" && sha256sum pint-release.apk > pint-release.apk.sha256)
          {
            echo "Commit: $GITHUB_SHA"
            echo "Version: $VERSION_NAME ($VERSION_CODE)"
            echo "Signer SHA-256: $PINT_SIGNER_SHA256"
            echo "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            cat "$RUNNER_TEMP/candidate/pint-release.apk.sha256"
            echo
            echo 'Download and test the attached APK. Record device results below before clicking Publish release.'
            echo 'Keep these assets and the target commit unchanged after testing. Publishing is maintainer approval.'
            echo
            cat docs/RELEASE_EVIDENCE_TEMPLATE.md
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Create draft for testing
        run: |
          url="$(gh release create "v$VERSION_NAME" \
            "$RUNNER_TEMP/candidate/pint-release.apk" \
            "$RUNNER_TEMP/candidate/pint-release.apk.sha256" \
            --draft --target "$GITHUB_SHA" --title "v$VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md")"
          echo "## Test and publish" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the [draft release]($url), test its APK, complete the checklist, then click **Publish release**." >> "$GITHUB_STEP_SUMMARY"

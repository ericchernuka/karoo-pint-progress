name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Verify generated drawables
        run: node tools/generate-drawables.mjs && node tools/validate-drawables.mjs && git diff --exit-code -- pint/src/main/res/drawable pint/src/main/kotlin/io/ericchernuka/pintprogress/PintAssetDrawables.kt
      - name: Verify Dokka output
        run: |
          set -euo pipefail
          ./gradlew :lib:dokkaGeneratePublicationHtml --rerun-tasks
          python3 tools/verify-dokka-output.py
          test -z "$(git status --porcelain=v1)"
      - name: Verify and build
        run: >-
          ./gradlew
          -PpintVersionCode="${GITHUB_RUN_NUMBER}"
          -PpintVersionName="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          :lib:testDebugUnitTest
          :pint:testReleaseUnitTest
          :pint:lintDebug
          :pint:assembleDebug
          :pint:assembleRelease
          :pint:jacocoBehaviorTestCoverageVerification
          :calorie-source:testDebugUnitTest
          :calorie-source:lintDebug
          :calorie-source:assembleDebug
          --no-daemon
      - name: Verify APK version metadata
        run: |
          test "$(apkanalyzer manifest version-code pint/build/outputs/apk/debug/pint-debug.apk)" = "${GITHUB_RUN_NUMBER}"
          test "$(apkanalyzer manifest version-name pint/build/outputs/apk/debug/pint-debug.apk)" = "1.0.0-dev.${GITHUB_RUN_NUMBER}"
      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pint-progress-UNSAFE-DEBUG-vc${{ github.run_number }}-${{ github.sha }}
          path: pint/build/outputs/apk/debug/pint-debug.apk
          if-no-files-found: error
          retention-days: 3
